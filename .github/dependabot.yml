# Dependabot (gratuito, no consume minutos de Actions): abre pull requests con actualizaciones.
# Cada PR pasa por el workflow "Web" antes de aceptarlo. Revisar el changelog antes de fusionar.
version: 2
updates:
  # Dependencias de la web (Astro, TypeScript...)
  - package-ecosystem: npm
    directory: /web/site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "web(deps)"
    groups:
      # Parches y versiones menores juntos en un solo PR; las versiones MAYORES, cada una en el suyo
      menores:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7: @astrojs/check (verificador de tipos de Astro) solo admite TypeScript 5 y 6
      # (peerDependencies "^5.0.0 || ^6.0.0", sep 2026). Quitar esta regla cuando lo admita.
      - dependency-name: typescript
        versions: [">=7"]

  # Las acciones del workflow (fijadas por hash)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"

  # La imagen base del Dockerfile (nginx, fijada por versión y hash): parches de seguridad
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "docker(deps)"
