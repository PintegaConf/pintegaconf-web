name: Deploy pintegaconf-web to VPS

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Build and deploy on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e

            echo "🚀 Deploying contest-app..."

            cd /root/PintegaConf/pintegaconf-web

            echo "📥 Pulling latest code"
            git pull origin main

            echo "🐳 Building Docker image"
            docker build --no-cache \
              -t pintega-web:latest .

            echo "🛑 Stopping old container (if exists)"
            docker stop pintega-web || true
            docker rm pintega-web || true

            echo "▶️ Running new container"
            docker run -d \
              --name pintega-web \
              -p 4321:8080 \
              --restart unless-stopped \
              pintega-web:latest

            echo "✅ Deployment successful"
          EOF