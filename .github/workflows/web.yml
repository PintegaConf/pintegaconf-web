# Comprobación automática de la web en cada cambio: instala las dependencias exactas, verifica tipos,
# compila, busca vulnerabilidades conocidas y AUDITA LA ACCESIBILIDAD (axe + recorrido real con Tab,
# ver web/site/tests/accesibilidad.mjs). Si algo falla, se ve en GitHub (y en el badge del README)
# antes de publicar.
#
# Los cambios entran en main por pull request: cuando la PR pasa las comprobaciones, el último job la
# fusiona solo (sin tener que darle a "Merge"). En el plan Free, GitHub no deja proteger main en un
# repositorio privado ni usar su auto-merge, así que la fusión la hace este workflow. Excepciones:
# las PR en borrador (draft) y las de Dependabot no se fusionan solas, para revisarlas antes.
#
# Coste: el plan Free de la organización incluye 2.000 minutos/mes en repos privados. La comprobación
# completa tarda unos 3 minutos y solo se hace si cambia algo de web/site, web/temporal, Docker o este archivo;
# en las demás PR solo corren los dos jobs cortos (mirar los archivos y fusionar).
name: Web

on:
  push:
    branches: [main]
    paths: ["web/site/**", "web/temporal/**", "web/nginx.conf", "Dockerfile", ".dockerignore", ".github/workflows/web.yml"]
  # Todas las PR, sin filtro de rutas: la fusión automática tiene que ejecutarse aunque no toquen la web
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # lanzarla a mano desde la pestaña Actions

# Mínimo privilegio: el workflow solo puede leer el código
permissions:
  contents: read

# Si llegan dos pushes seguidos, se cancela la ejecución anterior (ahorra minutos)
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # En una PR, mira si cambia algo de la web; si no, la comprobación completa se salta
  cambios:
    name: ¿Cambia la web?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.mirar.outputs.web }}
    steps:
      - id: mirar
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENTO" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Nombre actual y anterior (si se ha movido) de cada archivo de la PR
          ARCHIVOS=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qE '^(web/site/|web/temporal/|web/nginx\.conf$|Dockerfile$|\.dockerignore$|\.github/workflows/web\.yml$)' <<< "$ARCHIVOS"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Tipos, build, audit y accesibilidad
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/site
    steps:
      # Acciones fijadas por hash de commit (no por etiqueta, que se puede mover): Dependabot las actualiza
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/site/package-lock.json

      # npm ci + .npmrc (ignore-scripts): dependencias exactas del lockfile y sin scripts de instalación
      - name: Instalar dependencias
        run: npm ci

      # astro check (tipos) + astro build (incluye la descarga de fuentes y la optimización de imágenes)
      - name: Verificar tipos y compilar
        run: npm run build

      - name: Vulnerabilidades conocidas (npm audit)
        run: npm audit --omit=dev --audit-level=high

      # Los runners de GitHub (ubuntu-latest) traen Google Chrome instalado en /usr/bin/google-chrome
      - name: Accesibilidad de la web (WCAG 2.2 AA, teclado, comportamientos)
        run: node tests/accesibilidad.mjs

      - name: Accesibilidad de la web temporal
        run: node tests/accesibilidad.mjs
        env:
          A11Y_DIST: ../temporal
          A11Y_PAGINAS: /

  # La imagen Docker de despliegue (Dockerfile en la raíz) se construye y responde con las cabeceras
  # de seguridad. Los runners traen Docker; en local no hace falta tenerlo.
  docker:
    name: Imagen Docker
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir y arrancar
        run: |
          docker build -t pintegaconf-web .
          docker run -d --name web -p 8080:8080 pintegaconf-web
          # Esperar a nginx: mientras arranca, Docker acepta la conexión y la corta (error 56), no la rechaza
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:8080/

      - name: Comprobar la página, los archivos y las cabeceras
        run: |
          grep -q "Píntega Conf" <<< "$(curl -fsS http://localhost:8080/)"
          curl -fsS -o /dev/null http://localhost:8080/assets/fonts/arima.woff2
          curl -fsS -o /dev/null http://localhost:8080/assets/pausa.js
          CABECERAS=$(curl -fsSI http://localhost:8080/)
          echo "$CABECERAS"
          for c in "Strict-Transport-Security" "frame-ancestors 'none'" "X-Frame-Options: DENY" "X-Content-Type-Options: nosniff" "Referrer-Policy" "Permissions-Policy"; do
            grep -qiF "$c" <<< "$CABECERAS" || { echo "Falta la cabecera: $c"; exit 1; }
          done
          # nginx no debe decir su versión ("! grep" no haría fallar el paso con bash -e)
          if grep -qiE '^server: nginx/' <<< "$CABECERAS"; then echo "nginx enseña su versión"; exit 1; fi
          # Una ruta inexistente da 404 (y también lleva las cabeceras)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/no-existe)" = 404

      - name: Registro de nginx
        if: always()
        run: docker logs web

  # Fusiona la PR en main cuando todo ha ido bien. Solo PR de ramas de este repositorio (las abre
  # alguien con permiso de escritura), que no sean borrador ni de Dependabot. --match-head-commit:
  # solo se fusiona el commit que se ha comprobado; si llega otro push entretanto, se espera a su CI.
  # --rebase conserva los commits de la PR tal cual (uno por cambio) y deja el historial lineal.
  # --delete-branch borra la rama después (el ajuste "Automatically delete head branches" de GitHub
  # no actúa cuando la fusión la hace el propio workflow).
  fusionar:
    name: Fusionar en main
    needs: [cambios, build, docker]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      needs.cambios.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --rebase --match-head-commit "$SHA" --delete-branch
