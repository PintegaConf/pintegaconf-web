# nginx de la imagen Docker (Dockerfile en la raíz del repositorio).
# Cabeceras = las de web/site/public/_headers, traducidas. La CSP principal va en un <meta> de cada
# página; aquí solo el anti-iframe, que un <meta> no puede poner. Si cambias una, cambia la otra.
server {
    listen 8080;
    root /usr/share/nginx/html;

    server_tokens off;
    # Detrás de un proxy con HTTPS: redirecciones relativas, para no mandar a http:// ni al puerto 8080
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # HSTS: activar solo con el HTTPS del dominio funcionando (si después falla, los navegadores no dejan entrar en un año)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
